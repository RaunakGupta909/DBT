<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DBT Portal - Login / Register</title>
  <style>
    body{font-family: Arial, Helvetica, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#f5f7fb}
    .card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08);width:360px}
    h2{margin:0 0 12px}
    label{display:block;margin:8px 0 4px;font-size:13px}
    input,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px}
    button{margin-top:12px;padding:10px 12px;width:100%;background:#0b5ed7;color:#fff;border:none;border-radius:4px;cursor:pointer}
    .switch{display:flex;gap:8px;margin-bottom:12px}
    .msg{margin-top:10px;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Login / Register</h2>
    <div class="switch">
      <button id="show-login" style="flex:1;background:#0b5ed7;color:#fff">Login</button>
      <button id="show-register" style="flex:1;background:#eee;color:#333">Register</button>
    </div>

    <form id="login-form">
      <label for="login-username">Username (aadhaar/email)</label>
      <input id="login-username" name="username" required />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" required />
      <label for="login-role">Role</label>
      <select id="login-role" name="role">
        <option value="student">Student</option>
        <option value="parent">Parent</option>
        <option value="teacher">Teacher</option>
        <option value="volunteer">Volunteer</option>
        <option value="admin">Admin</option>
      </select>
      <button type="submit">Login</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <form id="register-form" style="display:none;margin-top:6px">
      <label for="reg-role">Role</label>
      <select id="reg-role" name="role">
        <option value="student">Student</option>
        <option value="parent">Parent</option>
        <option value="teacher">Teacher</option>
        <option value="volunteer">Volunteer</option>
        <option value="admin">Admin</option>
      </select>
      <label for="reg-username">Username (aadhaar/email)</label>
      <input id="reg-username" name="username" required />
      <label for="reg-password">Password</label>
      <input id="reg-password" name="password" type="password" required />
      <div id="student-extra" style="display:none">
        <label for="reg-name">Full name</label>
        <input id="reg-name" name="name" />
        <label for="reg-aadhaar">Aadhaar</label>
        <input id="reg-aadhaar" name="aadhaar" />
        <label for="reg-fatherName">Father's name</label>
        <input id="reg-fatherName" name="fatherName" />
        <label for="reg-fatherAadhaar">Father's Aadhaar</label>
        <input id="reg-fatherAadhaar" name="fatherAadhaar" />
        <label for="reg-schoolId">School ID</label>
        <input id="reg-schoolId" name="schoolId" />
      </div>
      <button type="submit">Register</button>
      <div class="msg" id="reg-msg"></div>
    </form>
  </div>

  <script src="/login.js"></script>
</body>
</html>
